name: Update the calendar

# Builds public/data/events.json from the adapters and every approved listing,
# commits it only when the listings actually changed, and publishes to
# datarail-site when they did.
#
# Runs twice a day, whenever an approved listing lands on main — merging a
# listing pull request is what puts it on the board — and on demand.

on:
  push:
    branches: [main]
    paths:
      - 'feed/curated/*.json'
      - 'feed/curated.json'
      - 'feed/feeds.json'
      - 'public/data/venues.json'

  # Twice a day, the same cadence as the datarail.org/events feed — and exactly
  # six hours out of phase with it (that one runs at 10:00 and 22:00 UTC), so
  # the two never queue for a runner at the same moment or hit the same hosts
  # together.
  #
  # 04:00 and 16:00 UTC is midnight and noon in New York during EDT, an hour
  # earlier during EST. GitHub's scheduler is best-effort and can run late under
  # load; at this cadence that does not matter.
  #
  # A run that finds nothing to list does not fail: an empty board that was
  # already empty is not a blanking. Losing listings still is, and still shouts.
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 16 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        type: choice
        default: dry-run
        options:
          - dry-run     # fetch and report, write nothing
          - probe       # hunt for venue feed endpoints, write nothing
          - build       # the real thing
          - bootstrap   # first run only: allowed to write an empty board

concurrency:
  group: glyph-calendar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.build.outputs.changed }}
      count: ${{ steps.build.outputs.count }}
      # The commit this run made. Publishing checks out exactly this: without
      # it, publish would check out the commit that triggered the run, which
      # predates the board just built, and ship the previous one.
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: feed/requirements.txt

      - name: Install dependencies
        run: pip install -r feed/requirements.txt

      - name: Probe for venue calendars
        if: github.event.inputs.mode == 'probe'
        run: python feed/build.py --probe

      - name: Build the board
        id: build
        if: github.event.inputs.mode != 'probe'
        env:
          PYTHONUNBUFFERED: '1'
          MODE: ${{ github.event.inputs.mode }}
        run: |
          # A push or a schedule arrives with no inputs at all, so an empty mode
          # has to mean the real build — otherwise merging a listing would only
          # ever dry-run it.
          [ -n "$MODE" ] || MODE=build
          case "$MODE" in
            build)     python feed/build.py ;;
            bootstrap) python feed/build.py --bootstrap ;;
            *)         python feed/build.py --dry-run ;;
          esac

      - name: Commit the board
        id: commit
        if: steps.build.outputs.changed == 'true'
        run: |
          # Gate on the file rather than on the event: a manual build should
          # commit, a dry run leaves nothing to commit, and this cannot get the
          # two confused. status, not diff: on the bootstrap run the file is
          # brand new and untracked, which diff reports as no change at all.
          if [ -z "$(git status --porcelain -- public/data/events.json)" ]; then
            echo "nothing written to commit"
            exit 0
          fi
          git config user.name  "glyph-calendar"
          git config user.email "contact@datarail.org"
          git add public/data/events.json
          git commit -m "Update the calendar (${{ steps.build.outputs.count }} listings)"
          # Two listings merged close together start two runs. Rebase rather
          # than force: losing a listing to a race is not acceptable.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Copies public/ into datarail-site/public/glyph, whose own deploy workflow
  # ships it to IONOS on push. Off until the repository variable PUBLISH_TO_SITE
  # is set to true and the DATARAIL_SITE_TOKEN secret exists — the same
  # dry-run-until-a-variable-flips shape the email receptionist uses.
  #
  # Despite the name, that secret holds the private half of an SSH deploy key
  # rather than a PAT. A deploy key is scoped to one repository by construction
  # and does not expire, which matters for a job that runs indefinitely: an
  # expiring PAT would take the live site stale months from now while the
  # calendar kept building green, and nothing would point at the cause.
  publish:
    needs: build
    if: needs.build.outputs.sha != '' && vars.PUBLISH_TO_SITE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Glyph at the commit just built
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.sha }}
          path: glyph

      - name: Check out the site
        uses: actions/checkout@v5
        with:
          repository: fvtale/datarail-site
          ssh-key: ${{ secrets.DATARAIL_SITE_TOKEN }}
          path: site

      - name: Copy the built site into place
        run: rsync -a --delete glyph/public/ site/public/glyph/

      - name: Commit to the site
        working-directory: site
        run: |
          # status, not diff: the first publish creates public/glyph/ from
          # nothing, and diff cannot see untracked files — it would report the
          # site as already matching and ship nothing, forever.
          if [ -z "$(git status --porcelain -- public/glyph)" ]; then
            echo "site already matches, nothing to push"
            exit 0
          fi
          git config user.name  "glyph-calendar"
          git config user.email "contact@datarail.org"
          git add public/glyph
          git commit -m "Update Glyph (${{ needs.build.outputs.count }} listings)"
          # The receptionist pushes leads to this repo too.
          git pull --rebase origin main
          git push origin HEAD:main
